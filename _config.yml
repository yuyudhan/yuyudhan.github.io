# _config.yml

# Site identity: used by the head metadata, the feed and the footer.
title: Ankur Pandey
tagline: I build developer tools
description: >-
  Ankur Pandey builds developer tools: keyboard-first apps, agent tooling and
  keyboard firmware, mostly in Rust and TypeScript.
lang: en
baseurl: ""
url: "https://yuyudhan.github.io"
github_username: yuyudhan
og_image: /assets/img/og-default.png

author:
  name: Ankur Pandey
  url: https://github.com/yuyudhan

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
# Category is deliberately NOT in the permalink: recategorising a post would
# otherwise change its URL. Old category-prefixed URLs redirect (see blog.html).
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml

# No theme: the layouts and the stylesheet in this repo are the whole design.
# (Without this, github-pages injects jekyll-theme-primer's assets/css/style.css.)
theme: null

redirect_from:
  json: false

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - AGENTS.md
  - openspec/
  - .pi/
  - README.md

# `collections.posts` is intentionally absent: posts already default to
# `output: true`, and a `permalink` here would silently shadow the top-level one.

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Ankur Pandey
  - scope:
      path: ""
      type: drafts
    values:
      layout: post
      author: Ankur Pandey
  - scope:
      path: ""
      type: pages
    values:
      layout: page
